<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sidebet-token" content="__SIDEBET_TOKEN__">
<meta name="color-scheme" content="dark light">
<title>Sidebet</title>
<link rel="icon" href="/chip.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="header">
  <div class="hd">
    <h1 id="pageTitle">Runs</h1>
    <div class="sub" id="projectLine"></div>
  </div>
  <div class="spacer"></div>
  <div class="live" id="live"><span class="dot"></span><span id="liveText">idle</span></div>
  <a class="btn primary" id="newBtn" href="#/new">New run</a>
</header>

<main id="main"></main>

<footer class="bar" id="bar">
  <a class="brand" href="#/runs" title="Sidebet">
    <img class="chip" id="barChip" src="/chip.svg" width="24" height="24" alt="">
    <span>sidebet</span>
  </a>
  <nav aria-label="Pages" id="nav">
    <a href="#/runs" data-view="runs">Runs</a>
    <a href="#/new" data-view="new">New</a>
    <a href="#/odds" data-view="odds">Odds</a>
    <a href="#/memory" data-view="memory">Memory</a>
    <a href="#/context" data-view="context">Context</a>
    <a href="#/policy" data-view="policy">Policy</a>
    <a href="#/doctor" data-view="doctor">Doctor</a>
    <a href="#/settings" data-view="settings">Settings</a>
  </nav>
  <div class="spacer"></div>
  <div class="bar-meta" id="barMeta"></div>
  <nav class="ext" aria-label="Links">
    <a href="https://sidebet.sh" target="_blank" rel="noopener">sidebet.sh</a>
    <a href="https://github.com/jamesray/sidebet" target="_blank" rel="noopener">GitHub</a>
    <a href="https://github.com/jamesray/sidebet/blob/main/docs/cli.md" target="_blank" rel="noopener">Docs</a>
  </nav>
</footer>

<div id="toasts" aria-live="polite"></div>
<dialog id="modal"></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
