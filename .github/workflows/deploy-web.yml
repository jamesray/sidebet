name: Deploy website

# Deploys apps/web (plain static files) to Cloudflare Pages with Wrangler.
# main -> production deployment; pull requests -> preview deployment with the URL as a PR comment.
#
# Required repository secrets:  CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# Optional repository variables: CF_PAGES_PROJECT (default "sidebet"), SITE_URL (overrides https://sidebet.sh in meta tags)

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/deploy-web.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    # Forks cannot read the secrets, so skip preview deployments for fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'sidebet' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf dist-web deploy-tmp && cp -R apps/web dist-web && mkdir deploy-tmp
          rm -f dist-web/README.md dist-web/assets/og.svg
          # Assets are cached for a day (see apps/web/_headers); version the stylesheet and script
          # URLs with the commit so every deploy forces browsers to fetch the new ones.
          v="${SHA:0:12}"
          sed -i "s#assets/site.css\"#assets/site.css?v=${v}\"#; s#assets/site.js\"#assets/site.js?v=${v}\"#" dist-web/index.html
          grep -c "?v=${v}" dist-web/index.html
          if [ -n "$SITE_URL" ]; then
            site="${SITE_URL%/}"
            sed -i "s#https://sidebet.sh#${site}#g" dist-web/index.html
            echo "Rewrote canonical/OG URLs to ${site}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Wrangler is installed in a scratch directory and called directly. cloudflare/wrangler-action
      # installs it with `npm install` at the repo root, which fails on the monorepo's workspace:*
      # dependencies, and it auto-detects pnpm, which this job does not set up.
      - name: Deploy
        id: deploy
        shell: bash
        working-directory: deploy-tmp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --loglevel=error wrangler@4
          wrangler() { npx --no-install wrangler "$@"; }
          wrangler --version
          if wrangler pages project list 2>/dev/null | grep -qE "(^|[^A-Za-z0-9_-])${PROJECT}([^A-Za-z0-9_-]|$)"; then
            echo "Pages project ${PROJECT} exists"
          else
            echo "Creating Pages project ${PROJECT}"
            wrangler pages project create "${PROJECT}" --production-branch main
          fi
          wrangler pages deploy ../dist-web \
            --project-name="${PROJECT}" \
            --branch="${BRANCH}" \
            --commit-hash="${SHA}" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url}"

      - name: Summary
        run: |
          {
            echo "### Website deployed"
            echo
            echo "- Project: \`$PROJECT\`"
            echo "- Branch: \`${{ github.head_ref || github.ref_name }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- sidebet-web-preview -->'
            const body = `${marker}\n**Website preview:** ${process.env.URL}\n\n_Built from ${context.payload.pull_request.head.sha.slice(0, 7)}._`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            })
            const mine = comments.find((c) => c.body && c.body.startsWith(marker))
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
